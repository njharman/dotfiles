# Use Ctrl-Space as prefix key for tmux commands
unbind-key C-b
set -g prefix 'C-Space'
# Use Ctrl-Space Ctrl-Space <command> to send commands to nested tmux
bind-key 'C-Space' send-prefix

## Reload Config
bind-key r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

# Things to remember
# ? list-keys
# w choose-window
# q display-panes
# l last-window
# & kill window

# Define a check for vim or neovim running in the current pane
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
# Define a check for common standard shells (bash, zsh, sh, fish, ksh)
is_shell='echo "#{pane_current_command}" | grep -iqE "(^|\/)(bash|zsh|sh|fish|ksh)$"'

## Settings
set -g history-limit 50000  # Scrollback lines kept per pane; bumped up since memory is cheap.
set -g history-file .tmux.history
set -g display-panes-time 3000
set -g visual-bell off
set -g renumber-windows on  # Keep window numbers contiguous after closing one.
set -g focus-events on      # Let panes see focus in/out (needed for vim/nvim autoread-on-focus plugins).

# Don't fuck Escape key
set -s escape-time 0

# '0' is at the wrong end of the keyboard
set -g base-index 1
set -g pane-base-index 1

# Don't lose track of SSH_AGENT etc. from parent environment
set -g update-environment -r


## Pane Selection
# By Ctrl-[hjkl] with awareness of vim splits. See https://github.com/christoomey/vim-tmux-navigator
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R


#  Mousyness
setw -g mouse on
# Right click to select current pane and paste
unbind-key MouseDown3Pane
bind-key -n MouseDown3Pane select-pane -t = \; run "tmux set-buffer \"$(xclip -selection clipboard -o)\"; tmux paste-buffer"

# Copy to system clipboard on mouse selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
# Double click to copy word to system clipboard
bind-key -T copy-mode-vi DoubleClick1Pane \
    select-pane \; \
    send-keys -X select-word \; \
    send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
# Triple click to copy line to system clipboard
bind-key -T copy-mode-vi TripleClick1Pane \
    select-pane \; \
    send-keys -X select-line \; \
    send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# If it's a shell, enter copy mode. Otherwise, pass the event to the app
bind -n WheelUpPane if-shell "$is_shell" \
    "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'" \
    "send-keys -M"
bind -n WheelDownPane if-shell "$is_shell" \
    "if -Ft= '#{pane_in_mode}' 'send-keys -M'" \
    "send-keys -M"
# bind -n WheelUpPane if-shell -Ft = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
# bind -n WheelUpPane if-shell "$is_vim" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"


## Vimtasticao
# vim bindings in copy and choice mode.
setw -g mode-keys vi
# vim bindings on command prompt.
set -g status-keys vi
setw -g xterm-keys on
# Ctrl-Space-Space to enter visual selection, scroll back.
bind-key Space copy-mode
# Visual select and yank when in copy mode.
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -sel clip -i'
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -n 'C-M-c' copy-mode
bind-key -n 'C-M-v' paste-buffer
# Paste top item in buffer list.
#bind-key p paste-buffer
# = choose-buffer
# Similar ":" alias as in .vimrc
bind-key \; command-prompt


## Statusline
set -g status-position bottom
set -g status-interval 1
set -g status-left '[#W-#S-#h]'
set -g status-right '#T %d-%b %R'
#set -g visual-activity on


## Window Titles
set -g set-titles on
set -g set-titles-string "#H > #W"
#setw -g allow-rename on
setw -g automatic-rename on
#setw -g automatic-rename-format
#setw -g window-status-format '#I:#W#F'
#setw -g window-status-current-format '#I:#W#F'


## Windows
setw -g monitor-activity on
bind-key b list-windows
# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on
# Splitting
unbind-key %    # default vert split
unbind-key '"'  # default horz split
bind-key h split-window -h
bind-key v split-window


## Colors
set -g terminal-overrides "*256col*:colors=256,xterm*:XT"
# tmux's own terminfo entry (more accurate than screen-256color).
set -g default-terminal "tmux-256color"
# Truecolor (24-bit color) support; only helps if your terminal emulator itself supports it too.
set -as terminal-overrides ",*256col*:Tc"
set -g pane-border-style fg=colour253
set -g pane-active-border-style fg=black
# Text
set -g message-style fg=colour235
set -g message-style bg=colour166
#set -g message-command-style fg=colour235
#set -g message-command-style bg=colour166
# pane number display
set -g display-panes-active-colour colour33 # blue
set -g display-panes-colour colour166 # orange
# Window
#setw -g mode-style
setw -g window-status-style fg=black
setw -g window-status-style bg=default
setw -g window-status-style dim
setw -g window-status-activity-style bold
setw -g window-status-current-style fg=green
setw -g window-status-current-style bg=black
setw -g window-status-current-style bold
# clock-mode
setw -g clock-mode-colour green
setw -g clock-mode-style 24
